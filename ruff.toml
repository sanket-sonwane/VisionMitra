# Ruff configuration for the VisionMitra Python backend and tests.
# Run from the repository root:  ruff check backend tests
#                               ruff format backend tests

line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "docs"]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI dependencies are function calls in argument defaults
]

[lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path setup happens in conftest before imports

[format]
quote-style = "double"
